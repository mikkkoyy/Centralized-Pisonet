[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mky-pisonet-central"
version = "0.1.0"
description = "Centralized PisoNet management server for Philippine computer shops"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "argon2-cffi>=23.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
packages = [
    "app",
    "app.core",
    "app.db",
    "app.models",
    "app.schemas",
    "app.api",
    "app.api.v1",
    "app.services",
    "app.web",
    "app.web.routes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
